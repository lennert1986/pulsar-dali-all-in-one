name: Validate All-in-One
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and test
        working-directory: pulsar_dali_all_in_one
        run: |
          python3 -m pip install paho-mqtt pyserial pyyaml
          python3 build_source.py app/pulsar_dali_control.py
          python3 -m py_compile app/*.py
          python3 app/test_bridge.py
          python3 app/test_hardware_profile.py
          python3 app/test_lab_checks.py
          python3 -c 'from pathlib import Path; import sys; sys.path.insert(0,"app"); from test_lab import PAGE; Path("/tmp/testlab.js").write_text(PAGE.split("<script>",1)[1].split("</script>",1)[0])'
          node --check /tmp/testlab.js
