name: Validate All-in-One
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and test
        working-directory: pulsar_dali_all_in_one
        run: |
          python3 -m pip install paho-mqtt pyserial pyyaml
          python3 build_source.py app/pulsar_dali_control.py
          python3 -m py_compile app/*.py
          python3 app/test_bridge.py
